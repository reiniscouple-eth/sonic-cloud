<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SonicCloud</title>
  <!-- Meta tags adicionais (ex: descrição) -->
  <meta name="description" content="SonicCloud - Arte interativa de áudio com p5.js" />

  <!-- Estilos CSS -->
  <style>
    /* Reset básico e estilos globais */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;           /* Fundo preto (preservando estilo original se diferente) */
      color: #fff;               /* Texto padrão branco para contraste no fundo escuro */
      font-family: sans-serif;   /* Fonte base (ajuste se houver fonte personalizada) */
    }
    /* Container para o sketch p5 */
    #sketch-container {
      position: relative;
      width: 100%;
      height: 100vh;  /* Ocupa a altura total da janela para exibir o canvas em tela cheia */
      overflow: hidden;
    }
    /* Certifica que o canvas preenche o container sem sobras de rolagem */
    #sketch-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Estilos do botão "Activate Mic" */
    #activate-mic-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      /* Estilos visuais originais do botão: */
      padding: 12px 24px;
      font-size: 16px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;  /* Exemplo: texto em maiúsculas */
      letter-spacing: 1px;
    }
    /* Efeito de hover do botão (opcional, conforme estilo original) */
    #activate-mic-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    /* Estilo do rodapé */
    footer {
      text-align: center;
      padding: 20px;
      background: #111;   /* Fundo ligeiramente diferenciado do corpo */
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Contêiner para o canvas e botão da arte interativa -->
  <div id="sketch-container">
    <!-- Botão "Activate Mic" centralizado dentro do container -->
    <button id="activate-mic-btn">Activate Mic</button>
  </div>

  <!-- Footer permanece fora do container, abaixo da arte interativa -->
  <footer>
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 16px 24px;">
    <div style="color: white; font-size: 1em; font-weight: 500;">
      Pulse by Reiniscouple
    </div>
    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
      <a href="#" target="_blank" style="background-color: white; color: black; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-weight: bold;">BUY</a>
      <a href="#" target="_blank" style="background-color: white; color: black; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-weight: bold;">CHART</a>
    </div>
  </div>
</footer>

  <!-- Inclusão das bibliotecas p5.js e p5.sound -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>

  <!-- Script p5.js principal -->
  <script>
    let mic;
    let micButton;

    function setup() {
      // Cria o canvas em tela cheia e o adiciona dentro do container #sketch-container
      let cnv = createCanvas(windowWidth, windowHeight);
      cnv.parent("sketch-container");

      // Inicializa entrada de áudio (microfone)
      mic = new p5.AudioIn();

      // Seleciona o botão "Activate Mic" existente no HTML e define seu parent para o container
      micButton = select("#activate-mic-btn");
      micButton.parent("sketch-container");

      // Ao clicar no botão, ativar o microfone e esconder o botão
      micButton.mousePressed(() => {
        // Necessário para habilitar contexto de áudio no browser
        if (getAudioContext().state !== 'running') {
          getAudioContext().resume();
        }
        mic.start();
        // Esconde o botão após ativação para não cobrir a tela (opcional)
        micButton.hide();
      });
    }

    function draw() {
      // Desenha o fundo (preserva a arte visual original aqui, se houver)
      background(0);

      // Exemplo simples de visualização: desenha um círculo proporcional ao volume do microfone
      if (mic && mic.enabled) {
        let volume = mic.getLevel();
        let diametro = map(volume, 0, 1, 50, width);  // mapeia o volume para um diâmetro de 50px até largura da tela
        fill(255);
        noStroke();
        ellipse(width/2, height/2, diametro, diametro);
      }

      // [Coloque aqui a lógica de desenho original da arte interativa, se diferente do exemplo acima]
    }

    function windowResized() {
      // Mantém o canvas em tela cheia se a janela for redimensionada
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>

</body>
</html>
