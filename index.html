<script>
let mic, fft;
let particles = [];
let micStarted = false;
let startButton;

function setup() {
  createCanvas(windowWidth, windowHeight);
  noStroke();
  background(0);

  startButton = createButton('Activate Mic');
  startButton.style('font-size', '18px');
  startButton.style('padding', '12px 24px');
  startButton.style('border', 'none');
  startButton.style('border-radius', '8px');
  startButton.style('background', '#00ff88');
  startButton.style('color', '#000');
  startButton.position(width / 2 - 80, height / 2 - 25);
  startButton.mousePressed(startMic);

  for (let i = 0; i < 26000; i++) {
    particles.push(new Particle());
  }
}

function startMic() {
  mic = new p5.AudioIn();
  mic.start(() => {
    fft = new p5.FFT();
    fft.setInput(mic);
    micStarted = true;
    startButton.hide();
  });
}

function draw() {
  background(0, 40);
  if (!micStarted) return;

  let spectrum = fft.analyze();
  let low = fft.getEnergy("bass");
  let high = fft.getEnergy("treble");

  let expansion = map(low + high, 0, 255 * 2, 0.5, 3);

  for (let p of particles) {
    p.update(expansion, low, high);
    p.display();
  }
}

class Particle {
  constructor() {
    this.baseX = random(-100, 100);
    this.baseY = random(-100, 100);
    this.size = random(0.5, 2);
    this.color = color(255);
  }

  update(expansion, low, high) {
    let t = millis() / 1000;
    let spread = expansion * 6;
    let x = this.baseX * spread + sin(t + this.baseX * 0.1) * 2;
    let y = this.baseY * spread + cos(t + this.baseY * 0.1) * 2;

    let colorRatio = high / (low + high + 1);
    let blue = lerp(0, 255, colorRatio);
    let green = lerp(255, 0, colorRatio);
    this.color = color(0, green, blue);

    this.x = width / 2 + x;
    this.y = height / 2 + y;
  }

  display() {
    fill(this.color);
    ellipse(this.x, this.y, this.size);
  }
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  if (startButton) {
    startButton.position(width / 2 - 80, height / 2 - 25);
  }
}
</script>
