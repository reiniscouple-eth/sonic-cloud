<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nova Obra</title>
  <meta name="description" content="Nova Obra - Interactive audio-reactive artwork by Reiniscouple" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: sans-serif;
    }

    #sketch-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #sketch-container canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="sketch-container"></div>

  <footer>
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 16px 24px;">
      <div style="color: white; font-size: 1em; font-weight: 500;">
        Nova Obra by Reiniscouple
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <a href="#" target="_blank" style="background-color: white; color: black; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-weight: bold;">BUY</a>
        <a href="#" target="_blank" style="background-color: white; color: black; padding: 10px 18px; text-decoration: none; border-radius: 4px; font-weight: bold;">CHART</a>
      </div>
    </div>
  </footer>

  <!-- p5.js e p5.sound -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>

  <script>
    let mic, fft;
    let particles = [];
    let micStarted = false;
    let startButton;

    function setup() {
      let cnv = createCanvas(windowWidth, windowHeight);
      cnv.parent('sketch-container');
      noStroke();
      background(0);

      startButton = createButton('Ativar Microfone');
      startButton.style('font-size', '18px');
      startButton.style('padding', '12px 24px');
      startButton.style('border', 'none');
      startButton.style('border-radius', '8px');
      startButton.style('background', '#00ff88');
      startButton.style('color', '#000');
      startButton.style('position', 'absolute');
      startButton.style('left', '50%');
      startButton.style('top', '50%');
      startButton.style('transform', 'translate(-50%, -50%)');
      startButton.parent('sketch-container');
      startButton.mousePressed(startMic);

      for (let i = 0; i < 4000; i++) {
        particles.push(new Particle());
      }
    }

    function startMic() {
      userStartAudio(); // Ativa o contexto de áudio
      mic = new p5.AudioIn();
      mic.start(() => {
        fft = new p5.FFT();
        fft.setInput(mic);
        micStarted = true;
        startButton.hide();
      });
    }

    function draw() {
      background(0, 40);
      if (!micStarted) return;

      let spectrum = fft.analyze();
      let low = fft.getEnergy("bass");
      let high = fft.getEnergy("treble");

      console.log("Low:", low, "High:", high); // Debug: mostra energia captada

      let expansion = map(low + high, 0, 255 * 2, 0.5, 3);

      for (let p of particles) {
        p.update(expansion, low, high);
        p.display();
      }
    }

    class Particle {
      constructor() {
        this.baseX = random(-100, 100);
        this.baseY = random(-100, 100);
        this.size = random(0.5, 2);
        this.color = color(255);
      }

      update(expansion, low, high) {
        let t = millis() / 1000;
        let spread = expansion * 6;
        let x = this.baseX * spread + sin(t + this.baseX * 0.1) * 2;
        let y = this.baseY * spread + cos(t + this.baseY * 0.1) * 2;

        let colorRatio = high / (low + high + 1);
        let blue = lerp(0, 255, colorRatio);
        let green = lerp(255, 0, colorRatio);
        this.color = color(0, green, blue);

        this.x = width / 2 + x;
        this.y = height / 2 + y;
      }

      display() {
        fill(this.color);
        ellipse(this.x, this.y, this.size);
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
